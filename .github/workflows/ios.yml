name: iOS | Build and TestFlight
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'config/features/ios.*.json'
      - 'scripts/feature_flags.py'
      - 'scripts/test_feature_flags.py'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'config/features/ios.*.json'
      - 'scripts/feature_flags.py'
      - 'scripts/test_feature_flags.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Archive, sign and upload to TestFlight (main only; needs Apple credentials)'
        type: boolean
        default: false
        required: true
      build_number:
        description: 'New App Store Connect build number for TestFlight (required for publish)'
        type: number
        default: 0
      marketing_version:
        description: 'CFBundleShortVersionString'
        type: string
        default: '0.9.0'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: iOS production-profile tests + simulator compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate feature profiles and generate iOS production constants
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/feature_flags.py --platform ios --profile production
      - name: Swift core tests
        run: swift test --package-path ios/PhotoZestCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned simulator target
        working-directory: ios
        run: xcodebuild -project PhotoZest.xcodeproj -scheme PhotoZest -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  publish-testflight:
    name: iOS production → App Store Connect TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-latest
    environment: ios-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate approved production flags
        run: python3 scripts/feature_flags.py --platform ios --profile production
      - name: Validate release inputs and Apple credentials
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_B64: ${{ secrets.APPSTORE_PRIVATE_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os, re
          if int(os.getenv('BUILD_NUMBER', '0')) <= 0 or not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}(?:[-.][0-9A-Za-z]+)*', os.getenv('MARKETING_VERSION', '')):
              raise SystemExit('Supply a new positive build_number and marketing_version.')
          missing = [k for k in ['IOS_TEAM_ID','IOS_PROFILE_NAME','IOS_PROFILE_B64','IOS_CERT_B64','IOS_CERT_PASSWORD','APPSTORE_KEY_ID','APPSTORE_ISSUER_ID','APPSTORE_PRIVATE_KEY_B64'] if not os.getenv(k)]
          if missing:
              raise SystemExit('Apple signing/App Store Connect credentials are not configured. No upload attempted.')
          PY
      - name: Install signing identity, profile, and App Store Connect API key
        env:
          IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY_B64: ${{ secrets.APPSTORE_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$IOS_CERT_B64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_B64" | base64 -D > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p '' "$RUNNER_TEMP/photozest.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/photozest.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/photozest.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/photozest.keychain-db" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/photozest.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k '' "$RUNNER_TEMP/photozest.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.private_keys"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/photozest.mobileprovision"
          printf '%s' "$APPSTORE_PRIVATE_KEY_B64" | base64 -D > "$HOME/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Archive signed iOS app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        working-directory: ios
        run: |
          xcodebuild -project PhotoZest.xcodeproj -scheme PhotoZest -sdk iphoneos -configuration Release -archivePath "$RUNNER_TEMP/PhotoZest.xcarchive" DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$MARKETING_VERSION" archive
      - name: Export signed IPA for App Store Connect
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as f:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle':'manual', 'teamID':os.environ['IOS_TEAM_ID'], 'provisioningProfiles':{'com.aetherexa.photozest.ios':os.environ['IOS_PROFILE_NAME']}}, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PhotoZest.xcarchive" -exportPath "$RUNNER_TEMP/photozest-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find "$RUNNER_TEMP/photozest-export" -name '*.ipa' -type f | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: photozest-ios-testflight-${{ inputs.build_number }}
          path: ${{ runner.temp }}/photozest-export/*.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload IPA to App Store Connect (TestFlight processing)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA="$(find "$RUNNER_TEMP/photozest-export" -name '*.ipa' -type f | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
