name: Verify PhotoZest
on:
  push:
    branches: [main, 'feature/photoflow-to-photozest-ios']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-policy:
    name: Swift policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: swift test --package-path ios/PhotoZestCore

  web:
    name: Web typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  android:
    name: Android unit tests and compact APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash scripts/materialize-android.sh
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android

  ios-simulator:
    name: iOS simulator compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project PhotoZest.xcodeproj -scheme PhotoZest -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
