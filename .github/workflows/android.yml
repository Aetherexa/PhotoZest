name: Android | Build and Google Play
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'config/features/android.*.json'
      - 'scripts/feature_flags.py'
      - 'scripts/test_feature_flags.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'config/features/android.*.json'
      - 'scripts/feature_flags.py'
      - 'scripts/test_feature_flags.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a signed Android App Bundle to Google Play internal testing (main only)'
        type: boolean
        default: false
        required: true
      version_code:
        description: 'Unique integer Google Play versionCode (required for publish)'
        type: number
        default: 0
      version_name:
        description: 'Display version for publishing'
        type: string
        default: '0.9.0'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Android production-profile unit tests + ABI APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all platform feature schemas
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/feature_flags.py --validate-all
      - name: Select Android production features (not entitlements)
        run: python3 scripts/feature_flags.py --platform android --profile production
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run tests + build Android ABI-specific debug APKs
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photozest-android-verified-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-internal:
    name: Android production → Google Play internal
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: android-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze Android production flags into release
        run: python3 scripts/feature_flags.py --platform android --profile production
      - name: Validate version and store credentials (fail closed)
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          SIGNING_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          code = int(os.getenv('VERSION_CODE', '0'))
          version = os.getenv('VERSION_NAME', '')
          if code <= 8 or not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}(?:[-.][0-9A-Za-z]+)*', version):
              raise SystemExit('Provide a new version_code (>8, and higher than previous store release) and a valid version_name.')
          secrets = ['SIGNING_B64','SIGNING_STORE_PASSWORD','SIGNING_KEY_ALIAS','SIGNING_KEY_PASSWORD','PLAY_SERVICE_ACCOUNT']
          if any(not os.getenv(name) for name in secrets):
              raise SystemExit('Missing Google Play/signing secrets in android-production environment. No upload attempted.')
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          source, code_matches = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, name_matches = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version}"', source, count=1)
          if code_matches != 1 or name_matches != 1:
              raise SystemExit('Unable to apply Android version override')
          path.write_text(source)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile production-profile release bundle + tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease
      - name: Sign Google Play App Bundle
        env:
          SIGNING_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/photozest-upload.jks"
          chmod 600 "$RUNNER_TEMP/photozest-upload.jks"
          export SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/photozest-upload.jks" -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_KEY_PASSWORD "$AAB" "$SIGNING_KEY_ALIAS"
          jarsigner -verify "$AAB"
      - name: Record feature manifest + source SHA
        run: |
          mkdir -p release
          cp config/features/android.production.json release/features.json
          printf '%s\n' "${{ github.sha }}" > release/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: photozest-android-production-bundle-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            release/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload to Google Play internal test track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aetherexa.photozest
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
