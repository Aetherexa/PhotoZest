name: Materialize Android sources
on:
  push:
    branches: ['feature/photoflow-to-photozest-ios']
    paths:
      - '.build-sources/photoflow/**'
      - 'scripts/materialize-android.sh'
      - '.github/workflows/materialize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore readable Android source
        run: bash scripts/materialize-android.sh
      - name: Commit readable Kotlin source to the migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(android): materialize original source for standalone PhotoZest app'
            git push origin HEAD:refs/heads/feature/photoflow-to-photozest-ios
          fi
